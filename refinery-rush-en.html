<title>Refinery Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: full-bleed 3D yard; instrument-panel HUD bolted to the edges; newspaper modals for history. */
:root{
  --ink:#14181b; --panel:rgba(20,24,27,.9); --panel2:#20262a; --line:#3a4349;
  --paper:#efe6d2; --muted:#9ba5a8; --signal:#f2a516; --signal2:#ffcf5a;
  --good:#74c27a; --bad:#e3563f; --steel:#b9c0c2;
  --ad:#4fd1a8; --news:#f1e8d4; --newsInk:#1d1b17;
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-news:"Old Standard TT",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
/* onboarding coach marks */
#onbRing{position:fixed;z-index:30;border:3px solid var(--signal2);border-radius:12px;box-shadow:0 0 0 9999px rgba(8,10,11,.48),0 0 18px rgba(255,207,90,.7);pointer-events:none;animation:onbPulse 1.4s ease-in-out infinite}
@keyframes onbPulse{50%{box-shadow:0 0 0 9999px rgba(8,10,11,.48),0 0 30px rgba(255,207,90,1)}}
#onbCard{position:fixed;z-index:31;width:min(340px,calc(100vw - 24px));background:var(--news);color:var(--newsInk);border-radius:12px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-family:var(--f-body);pointer-events:auto}
#onbCard .ot{font-family:var(--f-disp);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
#onbCard .ot small{font-family:var(--f-body);font-size:12px;opacity:.6;text-transform:none;letter-spacing:0}
#onbCard p{margin:0 0 10px;font-size:15px;line-height:1.35}
#onbCard .ob{display:flex;gap:8px;justify-content:space-between;align-items:center}
#onbCard button{font-family:var(--f-disp);font-weight:700;font-size:15px;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;min-height:36px}
#onbCard .onx{background:transparent;color:var(--newsInk);opacity:.65;text-decoration:underline;padding:7px 4px}
#onbCard .onn{background:var(--signal);color:var(--ink)}
#onbArrow{position:fixed;z-index:32;pointer-events:none;width:54px;height:81px;margin:-81px 0 0 -27px;transform-origin:50% 100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
#onbArrow svg{display:block}
#onbRing.soft{box-shadow:0 0 18px rgba(255,207,90,.7)}
#onbTip{position:fixed;z-index:32;pointer-events:none;max-width:min(260px,70vw);padding:7px 11px;border-radius:9px;background:rgba(20,24,27,.92);color:#fff6e0;font:700 13px/1.3 system-ui,sans-serif;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);border:1px solid rgba(242,165,22,.55)}
#onbTip.wait{border-color:rgba(255,255,255,.25);color:#e6ddc8;font-weight:600}
#onbSkip{position:fixed;z-index:33;top:58px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(20,24,27,.8);color:#efe6d2;font-size:18px;cursor:pointer}
#onbCard .pic{display:block;width:100%;height:auto;margin:2px 0 8px}
#onbCard .tap{animation:onbTap 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
#onbCard .rip{animation:onbRip 1.1s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
#onbCard .flo{animation:onbFlo 1.6s linear infinite}#onbCard .blk{animation:onbBlk 1.1s steps(1) infinite}#onbCard .spn{animation:onbSpn 2.4s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes onbTap{0%,100%{transform:translate(0,-6px)}45%{transform:translate(0,4px)}}
@keyframes onbRip{0%,40%{transform:scale(.2);opacity:0}50%{opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes onbFlo{to{stroke-dashoffset:-24}}@keyframes onbBlk{50%{opacity:.25}}@keyframes onbSpn{to{transform:rotate(360deg)}}
#onbCard .onx{font-size:20px!important;text-decoration:none!important;padding:4px 8px!important;line-height:1}
#onbCard .onn{min-width:64px;font-size:20px!important}
#onbCard .dots{display:flex;gap:4px}#onbCard .dots i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.18)}#onbCard .dots i.on{background:var(--signal)}

html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--paper)}
body{font-family:var(--f-body);font-size:14px;-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage.placing canvas{cursor:crosshair}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- top bar ---------- */
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:stretch;gap:10px;
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
#top>*{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.clock{flex-direction:row!important;align-items:baseline;gap:8px}
.yr{font-family:var(--f-disp);font-weight:900;font-size:34px;line-height:1;letter-spacing:.02em;color:var(--signal);font-variant-numeric:tabular-nums}
.mo{font-family:var(--f-disp);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.next{flex:1 1 220px;max-width:340px;gap:4px;cursor:pointer}
.next.go{box-shadow:0 0 0 2px var(--signal);animation:rdgo 1.2s ease-in-out infinite}@keyframes rdgo{50%{box-shadow:0 0 0 4px rgba(242,165,22,.35)}}
.paper.wide{width:min(1180px,100%)}
.rtree{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(122px,1fr);gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:10px 0 4px}
.rcol h4{font-family:var(--f-body);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;opacity:.75}
.rn{display:block;width:100%;text-align:left;border:1.5px solid rgba(0,0,0,.22);background:rgba(255,255,255,.4);padding:7px 8px;margin:0 0 7px;font-family:var(--f-body);font-size:12px;line-height:1.25;color:inherit;border-radius:3px}
.rn b{display:block;font-size:12.5px;margin-bottom:2px;overflow-wrap:break-word}.rn .rw{display:block;color:#2f6a3a;font-weight:600}.rn .rc{display:block;margin-top:3px;font-size:11.5px;opacity:.8}
.rn.done{background:#cfe3c8;border-color:#5b8a55}.rn.cur{background:#f6dc8a;border-color:#c99424}.rn.lock{opacity:.5}.rn.av{cursor:pointer}.rn.av:hover{border-color:#14181b;background:#fff}
.rn .ic{float:right;font-family:var(--f-disp);font-weight:800;font-size:11px;padding:1px 4px;border-radius:2px;color:#14181b;margin-left:4px}
.next span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next span b{color:var(--paper);font-weight:600}
.bar{height:6px;background:#0c0f11;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--signal);transition:width .3s}
.cash{align-items:flex-end;min-width:130px}
#money{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
#rate{font-size:12px;font-variant-numeric:tabular-nums;color:var(--good)}
#rate.neg{color:var(--bad)}
.stars{align-items:center;min-width:76px}
#stars{font-family:var(--f-disp);font-weight:800;font-size:22px;line-height:1;color:var(--signal2)}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:10px;height:4px;border-radius:2px;background:#0c0f11}
.pips i.on{background:var(--signal2)}
.ctrl{flex-direction:row!important;align-items:center;gap:4px;margin-left:auto}
.ctrl button{background:transparent;border:1px solid var(--line);border-radius:3px;min-width:34px;height:30px;font-family:var(--f-disp);font-weight:800;font-size:15px}
.ctrl #menuBtn{display:flex;align-items:center;gap:6px;padding:0 10px;background:#f2f0ea;color:var(--ink);border-color:#f2f0ea;margin-right:6px}.ctrl #menuBtn .ml{font-size:13px;letter-spacing:.06em;text-transform:uppercase}.ctrl #menuBtn:hover{background:var(--signal);border-color:var(--signal)}
.ctrl button.on{background:var(--signal);color:var(--ink);border-color:var(--signal)}

/* ---------- side panel ---------- */
#side{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(max(8px,env(safe-area-inset-top,0px)) + 64px);width:260px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 210px);overflow:auto;pointer-events:auto}
#side section{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
#side h3{margin:0 0 8px;font-family:var(--f-disp);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
#side h3 small{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:12px;color:var(--paper)}
.ct{border-left:3px solid var(--signal);padding:6px 0 6px 9px;margin-bottom:8px;display:flex;flex-direction:column;gap:5px;transition:background .3s}
.ct:last-child{margin-bottom:0}
.ct .t{font-weight:600;font-size:14px;line-height:1.2}
.ct .m{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ct .m b{color:var(--signal2);font-weight:600}
.ct.done{background:rgba(116,194,122,.18);border-color:var(--good)}
.ct.new{animation:slideIn .45s ease-out}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.mrow{display:grid;grid-template-columns:1fr auto 14px;gap:6px;font-size:13px;padding:2px 0;font-variant-numeric:tabular-nums;align-items:center}
.mrow .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.up{color:var(--good)} .dn{color:var(--bad)}
.brow{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.brow:last-child{margin-bottom:0}
.brow div:first-child{display:flex;justify-content:space-between}
.brow b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar.em i{background:var(--good)} .bar.em.over i{background:var(--bad)}
.bar.bal i{background:var(--good)}
#sideBtns{display:none}
#sideX{display:none}
.tag em{font-style:normal;font-family:var(--f-body);font-weight:600;font-size:11px;font-variant-numeric:tabular-nums}
.tag.jt i{width:44px} .tag.jt em{display:inline-block;min-width:9.5ch;text-align:right} .tag.jt::after{content:'▲';font-size:10px;width:10px;visibility:hidden;color:var(--good)} .tag.jt.unl::after{visibility:visible} .tag.jt i s{background:var(--signal)} .tag.jt.low i s{background:var(--bad)} .tag.jt.low em{color:var(--bad)}

/* ---------- build bar ---------- */
#build{position:absolute;left:0;right:0;bottom:0;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
#cards{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;padding:9px 2px 2px;scrollbar-width:thin}
.card{flex:0 0 auto;width:132px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 8px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:2px 7px;text-align:left;position:relative;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.card .code{grid-row:1/3;align-self:center;width:34px;height:34px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:13px;color:var(--ink);background:var(--steel);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.card .nm{font-weight:600;font-size:12.5px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cost{font-family:var(--f-disp);font-weight:800;font-size:15px;color:var(--signal2);font-variant-numeric:tabular-nums}
.card.poor .cost{color:var(--bad)}
.card.locked{opacity:.45;cursor:not-allowed}
.card.locked .cost{color:var(--muted)}
.card.on{border-color:var(--signal);background:#3a2e12}
.card.pulse{animation:pulse 1.1s infinite}
.card .cnt{position:absolute;top:-7px;left:6px;background:var(--panel2);border:1px solid var(--line);color:var(--paper);font-weight:700;font-size:11px;padding:0 6px;border-radius:9px;font-variant-numeric:tabular-nums}
.card .cnt:empty{display:none}
.card .badge{position:absolute;top:-7px;right:6px;background:var(--good);color:var(--ink);font-weight:700;font-size:11px;padding:1px 6px;border-radius:9px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,165,22,.8)}50%{box-shadow:0 0 0 7px rgba(242,165,22,0)}}

/* ---------- selection ---------- */
#sel{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 70px);width:300px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.sh{display:flex;align-items:center;gap:8px}
.sh .code{font-family:var(--f-disp);font-weight:900;font-size:13px;color:var(--ink);background:var(--signal);padding:2px 7px;border-radius:2px}
.sh h4{margin:0;font-family:var(--f-disp);font-weight:800;font-size:20px;flex:1;min-width:0;line-height:1.05}
.sh small{color:var(--muted);font-size:12px}
.sh button{background:none;border:0;font-size:20px;color:var(--muted);padding:0 4px}
#sel p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--signal);color:var(--ink);border:0;border-radius:3px;padding:8px 12px;font-weight:700;font-size:13px}
.btn:disabled{background:#4a4f52;color:#8b9294;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.status{font-weight:600}
.status.ok{color:var(--good)} .status.warn{color:var(--signal2)} .status.bad{color:var(--bad)}

/* ---------- floating bits ---------- */
#pauseBan{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top,0px)) + 128px);transform:translateX(-50%);background:#ffe48a;color:#2a2205;border:2px solid #e3b52f;border-radius:4px;padding:8px 18px;font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.14em;pointer-events:auto;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap;z-index:6;animation:pb 1.6s ease-in-out infinite}
#pauseBan small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:0;text-align:center;opacity:.75}
@keyframes pb{50%{opacity:.82}}
@media (max-width:760px),(max-height:500px){#pauseBan{top:calc(max(8px,env(safe-area-inset-top,0px)) + 148px);font-size:19px}}
#toasts{position:absolute;top:calc(max(8px,env(safe-area-inset-top,0px)) + 70px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--signal);padding:8px 14px;border-radius:3px;font-size:14px;animation:toastIn .35s ease-out;max-width:100%}
.toast b{color:var(--signal2)}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}
#hint{position:absolute;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 76px);background:var(--signal);color:var(--ink);font-weight:700;font-size:15px;padding:9px 16px;border-radius:3px;pointer-events:none;text-align:center;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
#hint::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--signal)}
.float{position:absolute;font-family:var(--f-disp);font-weight:800;font-size:18px;color:var(--signal2);text-shadow:0 2px 0 rgba(0,0,0,.55);white-space:nowrap;transform:translate(-50%,-50%);animation:rise 1.4s ease-out forwards}
.float.neg{color:var(--bad)} .float.good{color:var(--good)}
@keyframes rise{to{transform:translate(-50%,-260%);opacity:0}}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:4px;background:rgba(20,24,27,.78);border-radius:2px;padding:1px 4px;font-family:var(--f-disp);font-weight:800;font-size:11px;letter-spacing:.04em;white-space:nowrap}
.tag i{display:block;width:26px;height:4px;background:#000;border-radius:2px;overflow:hidden}
.tag i s{display:block;height:100%;background:var(--good)}
.tag.warn i s{background:var(--signal)} .tag.off{color:var(--bad)}
.alert{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--bad);color:#fff;border:2px solid #fff;border-radius:4px;padding:5px 10px;font-weight:700;font-size:13px;white-space:nowrap;animation:bob .7s ease-in-out infinite alternate;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.alert.ship{background:var(--signal);color:var(--ink);border-color:var(--ink)}
@keyframes bob{to{margin-top:-6px}}

/* ---------- camera controls ---------- */
#camctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 74px);display:flex;gap:4px;pointer-events:auto}
#camctl button{width:36px;height:36px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-size:17px;font-weight:700}
#bridgeBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom,0px)) + 76px);max-width:calc(100% - 32px);pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.35)}

/* ---------- newspaper modal ---------- */
#modal{position:absolute;inset:0;background:rgba(8,10,11,.62);display:grid;place-items:center;padding:16px;pointer-events:auto;z-index:20}
.paper{background:var(--news);color:var(--newsInk);width:min(520px,100%);max-height:100%;overflow:auto;padding:22px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);font-family:var(--f-news);animation:drop .45s cubic-bezier(.2,1.3,.4,1);transform-origin:50% 0}
@keyframes drop{from{transform:rotate(-3deg) translateY(-30px) scale(.9);opacity:0}}
.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double var(--newsInk);padding-bottom:4px;margin-bottom:12px;gap:10px}
.mast b{font-family:var(--f-news);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
.mast span{font-size:12px;font-style:italic;white-space:nowrap}
.paper h2{font-family:var(--f-news);font-weight:700;font-size:30px;line-height:1.08;margin:0 0 10px;text-wrap:balance}
.paper p{font-size:16px;line-height:1.45;margin:0 0 12px}
.paper .unlock{border:1.5px solid var(--newsInk);padding:10px 12px;margin:4px 0 14px;font-family:var(--f-body);display:flex;gap:12px;align-items:center}
.paper .unlock .code{font-family:var(--f-disp);font-weight:900;font-size:15px;background:var(--newsInk);color:var(--news);padding:6px 8px}
.paper .unlock div{font-size:14px;line-height:1.3}
.paper .btn{background:var(--newsInk);color:var(--news);font-family:var(--f-body);font-size:16px;padding:11px 18px}
.paper .btn.ghost{background:transparent;color:var(--newsInk);border:1.5px solid var(--newsInk)}
.paper .big{font-family:var(--f-disp);font-weight:900;font-size:58px;line-height:.95;letter-spacing:.01em;margin:4px 0 6px}
.paper .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-family:var(--f-body);font-size:14px;margin:6px 0 16px;font-variant-numeric:tabular-nums}
.logo{font-family:var(--f-disp);font-weight:900;font-size:46px;line-height:.9;letter-spacing:.01em;margin:0 0 12px;color:var(--newsInk)}
.logo span{color:#c8452f}
.mbtns{display:grid;gap:8px;margin-top:6px}
.mbtns .btn{width:100%;text-align:left;font-size:16px}

/* ================= SIMULATION ================= */
function trend(p,y){switch(p){
  case'benzine':return 1+clamp((y-1950)/40,0,1)*.35;
  case'kero':return y<1958?.85:1.35;
  case'gasolie':return y<1972?1:y<2005?.65:.33;
  case'diesel':return y<1980?1:1.15;
  case'residu':return y<1975?1:.72;
  default:return 1}}
function season(p){const m=(S.year%1)*12;if((p==='residu'||p==='gasolie')&&(m<2||m>=10))return 1.15;if(p==='benzine'&&m>=5&&m<8)return 1.12;return 1}
function effMul(){const e={crude:1,supply:1,all:1};for(const a of S.active)for(const k in a.eff)e[k]=(e[k]||1)*a.eff[k];return e}
function has(t){return S.units.some(u=>u.type===t&&u.phase==='run'&&u.connected&&!u.incident&&!u.upg)}
function price(p,e){const y=S.year;let v=PROD[p].p*trend(p,y)*e.all*(e[p]||1)*S.noise[p]*season(p);
  if(p==='benzine'){v*=1+.12*perk('benzine');if(y>=1991&&!has('ref')&&!has('alky'))v*=.8}
  if(p==='diesel'&&y>=2015&&has('h2'))v*=1.1;return v*LOC().price*(1+.03*mlv('prijs'))}
function crudePrice(e){return LOC().crude*8.2*e.crude*S.noise.crude*(S.year>2000?1.12:1)}
function jettyCap(){return 30*(1+.7*(S.jettyLvl-1))*(1+.25*perk('aanvoer'))}
function offCap(){let c=LOC().noRiver?6:25+10*(S.jettyLvl-1);for(const u of S.units)if(UNITS[u.type]&&UNITS[u.type].off&&u.phase==='run'&&u.connected&&!u.incident&&!u.upg)c+=UNITS[u.type].off*Math.pow(1.6,u.level-1);return c}
function bufCap(){return Math.round((700+800*countRun('tank'))*(1+.15*mlv('opslag')+.15*((S.rs&&S.rs.ps&&S.rs.ps.opslag)||0)))}
const COOL={cdu:3,hv:2,ref:2,fcc:4,stc:4,poly:2,hds:2,alky:2,hc:4};
const SOUR={cdu:1,hv:1,fcc:3,hds:2,hc:3,stc:1};
function capOf(u,pipeMul){const U=UNITS[u.type];let c=U.cap*Math.pow(1.6,u.level-1)*pipeMul*(1-.35*(u.wear||0))*(COOL[u.type]?(S.coolF??1)*(S.heatF??1):1);if(U.kraak)c*=1+.2*perk('kraak');if(u.type==='hds'&&!(has('ref')||has('h2')))c*=.6;return c}
function emisLimit(){return S.year<1985?Infinity:Math.round((S.year<2016?2.2:1.6)*(S.thru||0)+20)}

const flow={};
function step(dt){
  S.year+=dt/YSEC;
  timeline();unlocks();rsStep(dt);racksStep();taSched(dt);
  const e=effMul();
  // noise
  if(R()<dt){for(const k in S.noise){S.noise[k]*=1+(R()-.5)*.06;S.noise[k]+= (1-S.noise[k])*.06;S.noise[k]=clamp(S.noise[k],.85,1.15)}}
  // supply
  const cp=crudePrice(e);S.crudeP=cp;
  S.supply=e.supply*(LOC().ship||1);let cost=S.costAcc;S.costAcc=0;
  if(S.loc==='woestijn'){let wq=0;const cp=crudePrice(e);for(const u of S.units){const U=UNITS[u.type];if(!U||!U.well||u.phase!=='run'||!u.connected||u.incident||u.upg){if(U&&U.well)u.util=0;continue}
      const q=Math.min(U.well*Math.pow(1.6,u.level-1)*(1-.35*(u.wear||0))*(e.wells||1)*(1+.25*perk('aanvoer'))*dt,Math.max(0,bufCap()-S.buffer));S.buffer+=q;wq+=q;cost+=q*cp*.33;u.util=q/(U.well*dt)}S.wellRate=wq/dt;
    if(!S.nextStorm)S.nextStorm=Y0+3+R()*3;if(!S.storm&&S.year>=S.nextStorm){S.storm=S.year+.7;queueModal({kind:'news',ev:{title:'Sandstorm!',text:'A sandstorm sweeps over your refinery. Air coolers and cooling pumps work worse and your units wear twice as fast until the storm passes.',bad:1}})}
    if(S.storm&&S.year>=S.storm){S.storm=0;S.nextStorm=S.year+5+R()*4;toast('The sandstorm is over','good')}}
  if(S.loc==='pool'){let hd=0,hs=0;for(const u of S.units){const U=UNITS[u.type];if(!U||u.phase!=='run'||!u.connected||u.incident||u.upg)continue;const lv=Math.pow(1.6,u.level-1);
      if(COOL[u.type])hd+=COOL[u.type]*lv*.8;if(U.heat)hs+=U.heat*lv*(1-.3*(u.wear||0))}
    if(S.winter)hd*=1.7;S.heatDem=hd;S.heatSup=hs;S.heatF=hd>0?clamp(hs/hd,.4,1):1;

        toast(`${I.kind} at ${uname(u)} got out of hand: <b>${money(c)}</b> damage and a long repair`,'bad',5500);floatAt(u.g.position,'−'+money(c).slice(1),'neg',u.h)}}
      continue}

    const fz=S.loc==='pool'&&(S.heatF??1)<.97&&!!COOL[u.type];const base=base0*(1+2.5*(u.wear||0))*(fz?1+4*(1-S.heatF):1);if(u.util>.3&&R()<base*dt){u.incident={t:0,kind:fz&&R()<.6?'Frozen pipe':R()<.5&&['cdu','fcc','hc','ref'].includes(u.type)?'Fire':'Breakdown'};mkAlert(u);sfx('alert')}}
  const ps=pipeStats();if(ps.g>0&&S.leaks.length<2&&R()<.0003*ps.g*(1-.4*perk('veilig'))*dt){
    const ks=[];grid.forEach((c,k)=>{if(c&&c.k==='pipe'&&!c.pending&&c.style==='goot')ks.push(k)});const k=ks[R()*ks.length|0];

function project(v){const p=v.clone().project(cam);return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight,vis:p.z<1}}
function floatAt(pos,text,cls,h=2){const p=project(new THREE.Vector3(pos.x,h+.8,pos.z));if(!p.vis)return;const d=document.createElement('div');d.className='float '+(cls||'');d.textContent=text;d.style.left=p.x+'px';d.style.top=p.y+'px';overlay.appendChild(d);setTimeout(()=>d.remove(),1450)}

  while(MUS.next<c.currentTime+.35){const y=S?S.year:1940;const E=ERAS_M.find(e=>y<e.to);const bt=60/(E.bpm*(S&&S.loc==='pool'?.86:S&&S.loc==='jungle'?1.06:1)),t=MUS.next,b=MUS.beat;
    const bar=Math.floor(b/4),bi=b%4,ci=Math.floor(bar/2)%4,first=bar%2===0&&bi===0;const ch=E.ch[ci],root=E.ba[ci];const r=Math.random;
    if(E.st==='swing'){if(first)ch.forEach(m=>mNote(t,m,bt*8,'triangle',.016,{att:.3,rel:2,lp:1400}));

      for(let q=0;q<4;q++)mNote(t+q*bt/4,ch[(bi*4+q)%ch.length]+12,bt*.4,'triangle',.011,{att:.005,rel:.2});

  return st}
function onbStart(){ONB.steps=onbSteps();ONB.i=0;ONB.spot=null;ONB.t0=performance.now();ONB.on=ONB.steps.length>0;if(!ONB.on){$('#onbArrow').hidden=true;$('#onbRing').hidden=true;$('#onbSkip').hidden=true}onbRender()}
function onbEnd(){const fin=ONB.on&&ONB.i>=ONB.steps.length;ONB.on=false;$('#onbTip').hidden=true;$('#onbCard').hidden=true;$('#onbRing').hidden=true;$('#onbArrow').hidden=true;$('#onbSkip').hidden=true;if(ONB.loc==='woestijn'){if(!meta.onbW){meta.onbW=true;saveMeta()}}else if(!meta.onb){meta.onb=true;saveMeta()}
  if(fin)setTimeout(()=>{if(!S||!S.started)return;toast('Great! Your refinery is making money. <b>Complete contracts</b> for bonus cash and ★ stars.','good',7000);onbFlash($('#tgC')&&$('#tgC').offsetParent?$('#tgC'):$('#clist'))},900)}
/* briefly ring an element once, without any blocking */
function onbFlash(el){if(!el)return;const r=$('#onbRing'),b=el.getBoundingClientRect(),pd=6;r.hidden=false;r.style.left=(b.left-pd)+'px';r.style.top=(b.top-pd)+'px';r.style.width=(b.width+pd*2)+'px';r.style.height=(b.height+pd*2)+'px';r.classList.add('soft');setTimeout(()=>{if(!ONB.on){r.hidden=true}r.classList.remove('soft')},4000)}
function onbNext(){ONB.i++;if(ONB.i>=ONB.steps.length){ONB.i=ONB.steps.length;onbEnd();return}ONB.t0=performance.now();if(ONB.i>=ONB.steps.length){onbEnd();return}const s2=ONB.steps[ONB.i];if(s2.done&&s2.done()){onbNext();return}onbRender()}
function onbRender(){if(!ONB.on)return;const st=ONB.steps[ONB.i];$('#onbCard').hidden=true;$('#onbSkip').hidden=false;
  const el=st.el&&st.el();if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}catch(e){}onbPlace()}
function onbPlace(){if(!ONB.on)return;const st=ONB.steps[ONB.i],r=$('#onbRing'),a=$('#onbArrow'),mOpen=!$('#modal').hidden;
  $('#onbSkip').hidden=mOpen;if(mOpen){r.hidden=true;a.hidden=true;$('#onbTip').hidden=true;return}const W2=innerWidth,H2=innerHeight;let x,y,rot=0;
  const el=st.el&&st.el();
  if(el&&el.offsetParent!==null){const b=el.getBoundingClientRect(),pd=6;r.hidden=false;r.style.left=(b.left-pd)+'px';r.style.top=(b.top-pd)+'px';r.style.width=(b.width+pd*2)+'px';r.style.height=(b.height+pd*2)+'px';
    if(b.left>W2*.72&&b.top<H2*.75){x=b.left-10;y=b.top+b.height/2;rot=-90}else if(b.top>H2/2){x=b.left+b.width/2;y=b.top-10;rot=0}else{x=b.left+b.width/2;y=b.bottom+10;rot=180}}
  else if(st.el&&!st.pt){/* card not available yet: say why instead of pointing at nothing */
    r.hidden=true;a.hidden=true;const tp=$('#onbTip');const need=st.t?unitCost(st.t)-S.money:0;
    tp.textContent=!crewFree()?'The crane is building your unit… one moment':need>0?`Earning money… ${money(need)} more to go`:'';tp.className='wait';tp.hidden=!tp.textContent;
    if(!tp.hidden){const cb=$('#cards').getBoundingClientRect();tp.style.left=Math.max(8,(W2-tp.offsetWidth)/2)+'px';tp.style.top=Math.max(90,cb.top-tp.offsetHeight-12)+'px'}return}
  else{r.hidden=true;const v=st.pt&&st.pt();if(!v){a.hidden=true;$('#onbTip').hidden=true;return}const p=project(v);if(!p.vis){a.hidden=true;$('#onbTip').hidden=true;return}x=p.x;y=p.y-8;rot=0}
  const ax=Math.max(30,Math.min(W2-30,x)),ay=Math.max(85,Math.min(H2-4,y));
  a.hidden=false;a.style.left=ax+'px';a.style.top=ay+'px';a.style.transform=`rotate(${rot}deg)`;
  /* short instruction next to the arrow tail, kept inside the screen */
  const tp=$('#onbTip');if(st.tip){tp.textContent=st.tip;tp.className='';tp.hidden=false;const w=tp.offsetWidth,h=tp.offsetHeight;let tx,ty;
    if(rot===0){tx=ax-w/2;ty=ay-81-h-8}else if(rot===180){tx=ax-w/2;ty=ay+81+8}else{tx=ax-81-w-8;ty=ay-h/2}
    tp.style.left=Math.max(8,Math.min(W2-w-8,tx))+'px';tp.style.top=Math.max(64,Math.min(H2-h-8,ty))+'px'}else tp.hidden=true}
function onbTick(){if(!ONB.on||!S||!S.started)return;const st=ONB.steps[ONB.i];if(st.back&&st.back()&&ONB.i>0){ONB.i--;ONB.t0=performance.now();onbRender();return}if((st.done&&st.done())||(st.auto&&performance.now()-ONB.t0>st.auto*1000)){onbNext();return}onbPlace()}
$('#onbSkip').addEventListener('click',()=>{AU.init();onbEnd();sfx('click')});
setInterval(onbTick,250);addEventListener('resize',()=>setTimeout(onbPlace,60));
$('#onbCard').addEventListener('click',e=>{const b=e.target.closest('[data-o]');if(!b)return;AU.init();if(b.dataset.o==='skip'){onbEnd();sfx('click')}else onbNext()});

function switchLoc(loc){if(S&&S.started)saveGame();const sv=readSave(loc);if(sv){S.modalQ.length=0;$('#modal').hidden=true;loadGame(sv)}else startNew(loc)}
function resetBuildBar(){try{cardsEl.scrollLeft=0;const bb=$('#build');if(bb)bb.scrollLeft=0}catch(e){}}
function startNew(loc){if(S&&S.started&&S.loc!==loc)saveGame();clearSave(loc);S.modalQ.length=0;$('#modal').hidden=true;clearWorld();init(loc,true)}
resize();init();{const sv0=readSave();if(sv0)loadGame(sv0);else startNew('kust')}requestAnimationFrame(frame);
function finishUnit(u){if(u.type==='lab'&&!S.rs.seen){S.rs.seen=true;setTimeout(()=>{if(S.started)queueModal({kind:'rd'})},400)}revealRoads(u);setTimeout(()=>buildConn(u),0);u.g.remove(u.scaf);craneOff(u);u.model.scale.y=1;for(const[a,b]of u.route){const c=grid[idx(a,b)];if(c&&c.k==='pipe'){c.pending=false;refreshAround(a,b)}}u.phase='run';recomputeNetwork()}
})();
</script>
